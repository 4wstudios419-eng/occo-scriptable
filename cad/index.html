<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b">
  <title>ATLAS CAD</title>
  <link rel="manifest" href="./manifest.json">
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.js"></script>
</head>
<body data-theme="dark">
  <header class="topbar">
    <div>
      <div class="eyebrow">OTTAWA COUNTY CORONER'S OFFICE</div>
      <h1>ATLAS CAD</h1>
    </div>
    <button id="themeToggle" class="icon-btn" aria-label="Toggle day/night">☾</button>
  </header>
  <main id="app">
    <section id="loginView" class="card auth-card hidden">
      <h2>Sign in</h2><p>Use your ATLAS account.</p>
      <label>Email<input id="email" type="email" autocomplete="username"></label>
      <label>Password<input id="password" type="password" autocomplete="current-password"></label>
      <button id="loginBtn" class="primary">Sign in</button><div id="loginStatus" class="status"></div>
    </section>
    <section id="dashboardView" class="hidden">
      <div class="actions-row"><button id="newCaseBtn" class="primary">+ New Scene Response</button><button id="refreshBtn">Refresh</button></div>
      <section class="card"><div class="section-head"><h2>Open Scene Responses</h2><span id="responseCount" class="pill">0</span></div><div id="responsesList" class="stack"></div></section>
    </section>
    <section id="newCaseView" class="hidden">
      <button class="back" data-back="dashboard">‹ Back</button>
      <section class="card"><h2>New Scene Response</h2><p class="muted">Paste the scene address, choose the record type, and go. Full intake stays in ATLAS.</p><div class="grid2"><label class="span2">Scene Address / Location<input id="sceneAddress" autocomplete="street-address" placeholder="Paste address or facility here"></label><label class="span2">Record Type<select id="recordClass"><option value="test_training">Test / Training</option><option value="official">Official</option></select></label></div><button id="createCaseBtn" class="primary full">Create Response & Open CAD</button><div id="createStatus" class="status"></div></section>
    </section>
    <section id="responseView" class="hidden response-view">
      <div class="response-head compact-head"><button class="back" data-back="dashboard">‹ Responses</button><div class="response-identity"><div id="responseCaseNumber" class="case-number"></div><div id="responseAddress" class="response-address"></div></div><span id="responseStage" class="stage-pill">PENDING</span></div>
      <section class="route-card"><div class="route-label">LIVE ROUTE</div><div class="map-wrap"><div id="map"></div></div><div class="route-meta"><div class="route-summary"><div><strong id="routeHeadline">Locating you…</strong><span id="routeDetail">Preparing route to scene.</span></div><div class="route-eta"><strong id="routeEta">--</strong><span>ETA</span></div></div><div id="nextManeuver" class="next-maneuver hidden"></div></div></section>
      <div class="response-controls"><button id="navigateBtn" class="navigate">START NAVIGATION</button><div class="nav-fallbacks"><button id="googleMapsBtn">Google Maps</button><button id="wazeBtn">Waze</button></div><div class="grid2 response-stamps"><button data-stamp="responding_at">Responding / En Route</button><button data-stamp="on_scene_at">On Scene</button><button data-stamp="cleared_at" class="clear span2">Cleared Scene</button><button data-stamp="response_cancelled_at" class="cancel span2">Response Cancelled</button></div><div id="responseStatus" class="status"></div></div>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
